name: Build VoidRunner Tab5
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Generate 16-bit Pixel Art Assets
        run: python3 tools/gen_assets.py
      - name: Build ESP32-P4 Firmware
        run: |
          . $IDF_PATH/export.sh
          pip install -q "idf-component-manager>=2.3.0,<3.0.0"
          idf.py set-target esp32p4
          idf.py build || (grep -rn "error:" build/log/ && exit 1)
          esptool.py --chip esp32p4 merge_bin -o build/VoidRunner-tab5-merged.bin --flash_mode dio --flash_size 16MB 0x2000 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x20000 build/VoidRunner.bin
      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidRunner-tab5-firmware
          path: build/VoidRunner-tab5-merged.bin
      - name: Prepare GitHub Pages Flasher
        run: |
          mkdir -p site
          cp docs/index.html docs/manifest.json build/VoidRunner-tab5-merged.bin site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
